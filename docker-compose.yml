# GearVane with a local Ollama model server.
#
#   cp config.example.yaml config.yaml
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen2.5-coder
#   docker compose run --rm gearvane route --task "Fix a typo" --files README.md
#
# The `version` key is omitted: it is obsolete in Compose v2 and emits a warning.
#
# When Ollama runs in a container, localhost inside that container is not the
# host, so the local tier must point at the service name rather than
# http://localhost:11434. Override it here and in config.yaml.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama/models
    ports:
      - "11434:11434"
    healthcheck:
      # Wait for the server so dependent services do not start too early.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gearvane:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      # config.yaml is optional: GearVane falls back to config.example.yaml.
      - ./config.yaml:/app/config.yaml:ro
      # Runtime artifacts stay on the host so results survive a rebuild.
      - ./artifacts:/app/artifacts
    environment:
      # Keys are passed through the environment, never written into config.yaml.
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
    command: ["--config", "config.yaml", "health", "--offline"]

  gearvane-run:
    build: .
    profiles: ["run"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    # Override with your own args, e.g.:
    #   docker compose --profile run run --rm gearvane-run \
    #     run --task "Explain this module" --files src/app.py
    command: ["--config", "config.yaml", "--help"]

volumes:
  ollama-models: