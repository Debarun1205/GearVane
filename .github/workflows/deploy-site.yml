name: Deploy site

on:
  push:
    branches: [master, main]
    paths:
      # The builder bundles code from packages/harness, so a change there has
      # to redeploy the site as well. Leaving this as site/** alone means the
      # deployed builder silently drifts from the templates it ships.
      - 'site/**'
      - 'packages/harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The builder page imports the template engine from packages/harness, so
      # unlike the rest of the site it is bundled rather than copied. The
      # marketing page is still plain static files with no build step.
      - name: Bundle the builder page
        run: |
          npm ci --no-audit --no-fund
          npm run build:site

      # Everything under site/ is uploaded, including the generated bundle.
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4