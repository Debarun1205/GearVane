name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Coverage
        run: pytest tests/ --cov=waypoint --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 black isort mypy

      - name: flake8
        run: flake8 waypoint/ tests/

      - name: black
        run: black --check waypoint/ tests/

      - name: isort
        run: isort --check-only waypoint/ tests/

      - name: mypy
        run: mypy waypoint/ --ignore-missing-imports

  cli-smoke:
    # Asserts the shipped CLI actually runs, which unit tests alone missed:
    # a subparser dest collision made every safety/approve call print help
    # while the test suite stayed green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Route a simple task
        run: python -m waypoint route --task "Fix a typo in README" --files README.md

      - name: Route a complex task
        run: |
          python -m waypoint route \
            --task "Refactor the auth architecture" \
            --files a.py b.py c.py --json

      - name: Safety spend
        run: python -m waypoint safety spend

      - name: Safety check
        run: python -m waypoint safety check --command "git status"

      - name: Stats
        run: python -m waypoint stats

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, cli-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/