name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Python reference implementation.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Coverage
        run: pytest tests/ --cov=waypoint --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # TypeScript packages, ordered so each builds after what it depends on.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace @waypoint/core

      # The desktop app imports the harness for the builder, and TypeScript
      # resolves it through package exports, so the harness must be built
      # first. It was not, and every desktop build failed to find the module.
      - name: Build harness
        run: npm run build --workspace @waypoint/harness

      - name: Build app-core
        run: npm run build --workspace @waypoint/app-core

      - name: Build cli
        run: npm run build --workspace @waypoint/cli

      - name: Build desktop
        run: npm run build --workspace waypoint-app

      - name: Build extension
        run: npm run build --workspace waypoint

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build everything
        # The CLI's end-to-end tests run the built binary. Without building
        # them here they fall back to fetching tsx over the network, which is
        # not a declared dependency and made the suite fail on CI.
        run: |
          npm run build --workspace @waypoint/core
          npm run build --workspace @waypoint/harness
          npm run build --workspace @waypoint/app-core
          npm run build --workspace @waypoint/cli
          npm run build --workspace waypoint
          npm run build --workspace waypoint-app

      - name: Run package tests
        run: npm run test --workspaces --if-present

      - name: Run repository tests
        # Covers the site and the gitignore contract.
        run: npm run test:repo

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core and app-core
        run: |
          npm run build --workspace @waypoint/core
          npm run build --workspace @waypoint/app-core

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 waypoint/ tests/

      - name: black
        run: black --check waypoint/ tests/

      - name: isort
        run: isort --check-only waypoint/ tests/

      - name: mypy
        run: mypy waypoint/ --ignore-missing-imports

  # Asserts the shipped CLIs actually run. Unit tests alone missed a subparser
  # dest collision that made two commands print help while tests stayed green.
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          npm ci
          npm run build --workspace @waypoint/core
          npm run build --workspace @waypoint/cli

      - name: Python CLI
        run: |
          waypoint route --task "Fix a typo in README" --files README.md
          waypoint safety spend
          waypoint stats
          waypoint --version

      - name: TypeScript CLI
        run: |
          node packages/cli/dist/bin.js route --task "Fix a typo in README"
          node packages/cli/dist/bin.js route --task "Refactor the auth architecture" --json
          node packages/cli/dist/bin.js safety spend
          node packages/cli/dist/bin.js --version

      - name: The TypeScript CLI routes the same way as Python
        # Both implementations claim identical behaviour; this proves it.
        run: |
          set -euo pipefail
          task="Refactor the auth architecture for concurrency"
          files="a.py b.py c.py"
          py=$(waypoint route --task "$task" --files $files --json | python -c 'import json,sys; print(json.load(sys.stdin)["tier"])')
          ts=$(node packages/cli/dist/bin.js route --task "$task" --files $files --json | python -c 'import json,sys; print(json.load(sys.stdin)["tier"])')
          echo "python=$py typescript=$ts"
          test "$py" = "$ts"

  # The renderer must stay a single self-contained bundle, since the same file
  # ships inside the Android webview.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build --workspace @waypoint/core
          npm run build --workspace @waypoint/app-core
          npm run build --workspace waypoint-app

      - name: The renderer has no top-level imports
        run: |
          if grep -qE '^[[:space:]]*import ' apps/desktop/renderer/renderer.js; then
            echo "renderer bundle is not self-contained"
            exit 1
          fi
          echo "bundle is $(wc -c < apps/desktop/renderer/renderer.js) bytes"

  package:
    runs-on: ubuntu-latest
    needs: [python, javascript, javascript-tests, lint, python-lint, cli-smoke, bundle]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build the Python distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Build the extension package
        run: |
          npm ci
          npm run build --workspace @waypoint/core
          npm run build --workspace waypoint
          cd apps/vscode-extension
          npx vsce package --no-dependencies --allow-missing-repository

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/
            apps/vscode-extension/*.vsix
          if-no-files-found: error