name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Python reference implementation.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Coverage
        run: pytest tests/ --cov=gearvane --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # TypeScript packages, ordered so each builds after what it depends on.
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace @gearvane/core

      # The desktop app imports the harness for the builder, and TypeScript
      # resolves it through package exports, so the harness must be built
      # first. It was not, and every desktop build failed to find the module.
      - name: Build harness
        run: npm run build --workspace @gearvane/harness

      - name: Build app-core
        run: npm run build --workspace @gearvane/app-core

      - name: Build cli
        run: npm run build --workspace @gearvane/cli

      - name: Build desktop
        run: npm run build --workspace gearvane-app

      - name: Build extension
        run: npm run build --workspace gearvane

  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build everything
        # The CLI's end-to-end tests run the built binary. Without building
        # them here they fall back to fetching tsx over the network, which is
        # not a declared dependency and made the suite fail on CI.
        run: |
          npm run build --workspace @gearvane/core
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/app-core
          npm run build --workspace @gearvane/cli
          npm run build --workspace gearvane
          npm run build --workspace gearvane-app

      - name: Run package tests
        run: npm run test --workspaces --if-present

      - name: Run repository tests
        # Covers the site and the gitignore contract.
        run: npm run test:repo

      - name: Verify the owner's requirements against the real catalog
        # One script, not a test suite: prints PASS/FAIL per requirement and
        # exits non-zero on any failure. Reads models.json, config.example.yaml
        # and the source constants, so a claim in the README or a config
        # default that drifts from the catalog fails the build here.
        run: node tools/verify-requirements.mjs

      - name: Check every weight is pinned to a revision
        # S7. All fifty URLs used to read `.../resolve/main/<file>`, so the
        # bytes behind a URL could change under an installed app and nothing
        # recorded what it expected to receive. This fails on any unpinned
        # entry and makes no network calls, so it gates every push.
        run: node tools/check-catalog-pins.mjs

      - name: The generated tables and notices are current
        # Same contract as the generators themselves: a stale table fails rather
        # than quietly reporting a catalog the app no longer offers.
        run: |
          node tools/gen-site-catalog.mjs --check
          node tools/gen-readme-tables.mjs --check
          node tools/gen-third-party-notices.mjs --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        # Typecheck resolves each workspace through package exports, so a
        # workspace that imports another one needs that one's dist present.
        # The harness was missed here and the desktop typecheck failed with
        # 'Cannot find module @gearvane/harness'.
        run: |
          npm run build --workspace @gearvane/core
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/app-core

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 gearvane/ tests/

      - name: black
        run: black --check gearvane/ tests/

      - name: isort
        run: isort --check-only gearvane/ tests/

      - name: mypy
        run: mypy gearvane/ --ignore-missing-imports

  # Asserts the shipped CLIs actually run. Unit tests alone missed a subparser
  # dest collision that made two commands print help while tests stayed green.
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          npm ci
          npm run build --workspace @gearvane/core
          # The CLI imports the harness for the agent and build commands.
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/cli

      - name: Python CLI
        run: |
          gearvane route --task "Fix a typo in README" --files README.md
          gearvane safety spend
          gearvane stats
          gearvane --version

      - name: TypeScript CLI
        run: |
          node packages/cli/dist/bin.js route --task "Fix a typo in README"
          node packages/cli/dist/bin.js route --task "Refactor the auth architecture" --json
          node packages/cli/dist/bin.js safety spend
          node packages/cli/dist/bin.js --version

      - name: The TypeScript CLI routes the same way as Python
        # Both implementations claim identical behaviour; this proves it.
        run: |
          set -euo pipefail
          task="Refactor the auth architecture for concurrency"
          files="a.py b.py c.py"
          py=$(gearvane route --task "$task" --files $files --json | python -c 'import json,sys; print(json.load(sys.stdin)["tier"])')
          ts=$(node packages/cli/dist/bin.js route --task "$task" --files $files --json | python -c 'import json,sys; print(json.load(sys.stdin)["tier"])')
          echo "python=$py typescript=$ts"
          test "$py" = "$ts"

      - name: The builder command scaffolds
        # Unit tests can pass while the shipped binary cannot resolve a
        # workspace dependency. The command has to actually run.
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          node packages/cli/dist/bin.js build \
            --template landing \
            --name "Smoke Test" \
            --tagline "Scaffolded in CI" \
            --features "One;Two" \
            --out "$out"
          test -f "$out/index.html"
          grep -q "Smoke Test" "$out/index.html"
          echo "scaffolded $(ls -1 "$out" | wc -l) files"

      - name: The agent command reports its tools
        # --dry-run must not contact a model, so this is safe on a runner with
        # no provider reachable.
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js agent --task "smoke" --dry-run | tee /dev/stderr | grep -q read_file

  # The renderer must stay a single self-contained bundle, since the same file
  # ships inside the Android webview.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # The desktop app imports the harness for the builder, so it has to be
        # built before the renderer can be bundled.
        run: |
          npm run build --workspace @gearvane/core
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/app-core
          npm run build --workspace gearvane-app

      - name: The renderer has no top-level imports
        run: |
          if grep -qE '^[[:space:]]*import ' apps/desktop/renderer/renderer.js; then
            echo "renderer bundle is not self-contained"
            exit 1
          fi
          echo "bundle is $(wc -c < apps/desktop/renderer/renderer.js) bytes"

  # The app ships for Windows and Linux (macOS too); the ubuntu jobs cannot
  # speak for the desktop targets. This runs the same suites on the other two
  # as jobs of their own rather than a matrix over the existing ones, so any
  # check names branch protection already requires keep their exact shape.
  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # tests/parity.test.ts shells out to `python -m gearvane` to prove
        # both engines route identically. The ubuntu image happens to carry
        # PyYAML; the Windows and macOS images do not, and the subprocess
        # died with `No module named 'yaml'`.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install dependencies
        run: |
          npm ci
          npm run build --workspace @gearvane/core
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/app-core
          npm run build --workspace @gearvane/cli
          npm run build --workspace gearvane
          npm run build --workspace gearvane-app

      - name: Run package tests
        run: npm run test --workspaces --if-present

      - name: Run repository tests
        run: npm run test:repo

  # Unit tests pin source text; they never execute the renderer or a real
  # BrowserWindow, and four shipped bugs (all the way through v0.3.0) were
  # exactly that blind spot. These suites run the built bundle in Chromium
  # and the built app in Electron, with zero page and console errors.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run build --workspace @gearvane/core
          npm run build --workspace @gearvane/harness
          npm run build --workspace @gearvane/app-core

      - name: Install Playwright's browser (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Install Playwright's browser
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        run: npx playwright install chromium

      - name: Run the end-to-end suites (Linux)
        # Electron needs a display; xvfb supplies one with nothing on it.
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e --workspace gearvane-app

      - name: Run the end-to-end suites
        if: runner.os != 'Linux'
        run: npm run test:e2e --workspace gearvane-app

  # Secret scanning. Standalone on purpose: it must run even when the
  # build jobs fail, and adding it to `package.needs` would reshape a
  # check branch protection already requires.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    runs-on: ubuntu-latest
    needs: [python, javascript, javascript-tests, lint, python-lint, cli-smoke, bundle, portability, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build the Python distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Build the extension package
        run: |
          npm ci
          npm run build --workspace @gearvane/core
          # The extension imports the harness for the agent panel.
          npm run build --workspace @gearvane/harness
          npm run build --workspace gearvane
          cd apps/vscode-extension
          npx vsce package --no-dependencies --allow-missing-repository

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/
            apps/vscode-extension/*.vsix
          if-no-files-found: error