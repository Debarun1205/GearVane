name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Monday morning, off the congested top-of-hour slots.
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code-scanning tab.
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        # The JavaScript extractor needs no build (node_modules is excluded
        # by default); the Python extractor parses sources directly. This
        # step is the CodeQL template's no-op for both.
        uses: github/codeql-action/autobuild@v3

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
