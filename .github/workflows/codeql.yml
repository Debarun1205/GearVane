name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Monday morning, off the congested top-of-hour slots.
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Least-privilege defaults.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code-scanning tab.
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@c29f4eedf1fb43be1c9b9611f2e861ca03ad0008 # v3.28.16
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        # The JavaScript extractor needs no build (node_modules is excluded
        # by default); the Python extractor parses sources directly. This
        # step is the CodeQL template's no-op for both.
        uses: github/codeql-action/autobuild@c29f4eedf1fb43be1c9b9611f2e861ca03ad0008 # v3.28.16

      - name: Analyse
        uses: github/codeql-action/analyze@c29f4eedf1fb43be1c9b9611f2e861ca03ad0008 # v3.28.16
        with:
          category: '/language:${{ matrix.language }}'
