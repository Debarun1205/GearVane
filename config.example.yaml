# GearVane configuration
#
# Copy this file to config.yaml and edit it:
#
#     cp config.example.yaml config.yaml
#
# GearVane falls back to this file when config.yaml is absent, so a fresh
# clone runs without the copy step.

# ---------------------------------------------------------------------------
# Model tiers
# ---------------------------------------------------------------------------
# Each tier lists providers and the models they expose. The router classifies
# a task and picks a tier; within a tier, providers are used round-robin and
# the first listed model is chosen.
#
# Local providers need no credentials. Hosted providers read their key from
# the environment variable named in api_key_env, never from this file.

tiers:
  # Simple, well-scoped edits. Free to run.
  local:
    description: "Local models for simple tasks"
    cost_per_token: 0.0
    max_retries: 2
    providers:
      # The models bundled with the desktop app, plus anything the Models
      # dialog downloads: nothing to install, served by the app itself on
      # loopback. First, so a fresh install works before any server is set up.
      - name: embedded
        base_url: "http://127.0.0.1:11439"
        models:
          - qwen2.5-coder-0.5b-instruct-q4_0
          - smollm2-360m-instruct.q4_k_m
          - qwen2.5-1.5b-instruct-q4_0
          - llama-3.2-1b-instruct-q4_k_m
          - llama-3.2-3b-instruct-q4_k_m
          - gemma-2-2b-it-q4_k_m
          - deepseek-r1-distill-qwen-1.5b-q4_k_m
          - qwen2.5-coder-1.5b-instruct-q4_0
          - qwen2.5-coder-3b-instruct-q4_0
          - smollm2-1.7b-instruct.q4_k_m
          - qwen3-0.6b.q4_k_m
          - tinyllama-1.1b-chat-v1.0.q4_k_m
          - deepseek-coder-1.3b-instruct.q4_k_m
          - falcon3-3b-instruct-q4_k_m
          - phi-3-mini-4k-instruct-q4
          - qwen2.5-3b-instruct-q4_0
          - qwen2.5-0.5b-instruct-q4_0
          - qwen2.5-coder-3b-instruct-q4_0
          - smollm2-1.7b-instruct.q4_k_m
          - qwen3-0.6b.q4_k_m
          - tinyllama-1.1b-chat-v1.0.q4_k_m
          - deepseek-coder-1.3b-instruct.q4_k_m
          - falcon3-3b-instruct-q4_k_m
          - phi-3-mini-4k-instruct-q4
          - qwen2.5-3b-instruct-q4_0
          - qwen2.5-0.5b-instruct-q4_0
      - name: ollama
        base_url: "http://localhost:11434"
        models:
          - qwen2.5-coder
          - qwen3
          - codellama
          - deepseek-coder-v2
          - starcoder2
          - codestral
          - llama3.3
          - gemma3
          - phi3
          - mistral
      - name: lm_studio
        base_url: "http://localhost:1234"
        models:
          - qwen2.5-coder-7b
      # llama.cpp's server answers with the single model passed via -m; use
      # its file name here. It shares 8080 with LocalAI, so only one runs
      # at a time; the router takes whichever answers.
      - name: llama_cpp
        base_url: "http://localhost:8080"
        models:
          - qwen2.5-coder-7b-instruct-q4_k_m
      # vLLM serves the Hugging Face ID given to --model.
      - name: vllm
        base_url: "http://localhost:8000"
        models:
          - Qwen/Qwen2.5-Coder-7B-Instruct
      # LocalAI serves any GGUF it hosts over an OpenAI-compatible API.
      # Models are whatever you have installed; qwen3-4b is one example.
      - name: localai
        base_url: "http://localhost:8080"
        models:
          - qwen3-4b
      # GPT4All's local server. Models are the installed model names.
      - name: gpt4all
        base_url: "http://localhost:4891"
        models:
          - Meta-Llama-3-8B-Instruct
      # oobabooga's text-generation-webui with the OpenAI extension enabled
      # (port 5001 on newer versions). The model is the loaded model name.
      - name: textgen
        base_url: "http://localhost:5000"
        models:
          - qwen2.5-coder-7b-instruct
      # Any other OpenAI-compatible server works the same way with an
      # explicit base_url and no entry in the defaults at all.

  # Medium complexity, usually multi-file changes.
  mid:
    description: "Mid-tier models for medium complexity"
    cost_per_token: 0.0001
    max_retries: 2
    providers:
      # Keyless mid-tier capability: larger local weights served by the
      # app itself. First, like the local tier; missing files fail fast
      # and routing moves on.
      - name: embedded
        base_url: "http://127.0.0.1:11439"
        models:
          - qwen2.5-7b-instruct-q4_k_m
          - mistral-7b-instruct-v0.3-q4_k_m
          - deepseek-r1-distill-qwen-7b-q4_k_m
          - falcon3-7b-instruct-q4_k_m
          - qwen2.5-coder-7b-instruct-q4_0
          - falcon3-1b-instruct-q4_k_m
          - qwen3-1.7b.q4_k_m
          - starcoder2-7b-q4_k_m
          - qwen3-4b.q4_k_m
          - starcoder2-3b-q4_k_m
      - name: openrouter
        api_key_env: OPENROUTER_API_KEY
        models:
          - anthropic/claude-haiku-4-5
          - google/gemini-2.5-flash
          - openai/gpt-5-mini
      # Meta's Muse Spark over its OpenAI-compatible endpoint. The key
      # variable is MODEL_API_KEY, as documented by Meta, not META_API_KEY.
      - name: meta
        api_key_env: MODEL_API_KEY
        models:
          - muse-spark-1.3
          - muse-spark-1.2
      - name: deepseek
        api_key_env: DEEPSEEK_API_KEY
        models:
          - deepseek-v4-flash
          - deepseek-v4-pro
      # Gemini needs no endpoint overrides: the defaults already point chat at
      # /chat/completions and models at /models under /v1beta/openai.
      - name: gemini
        api_key_env: GEMINI_API_KEY
        models:
          - gemini-2.5-flash
      - name: mistral
        api_key_env: MISTRAL_API_KEY
        models:
          - mistral-large-latest

  # Hard problems: architecture, debugging, performance work.
  frontier:
    description: "Frontier models for hard tasks"
    cost_per_token: 0.005
    max_retries: 3
    providers:
      - name: anthropic
        api_key_env: ANTHROPIC_API_KEY
        models:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
      - name: openai
        api_key_env: OPENAI_API_KEY
        models:
          - gpt-6-astra
          - gpt-6-sol
          - gpt-6-luna
          - gpt-5
      # Note on GPT-6 tool use: Astra performs tool calling through OpenAI's
      # Responses API, while this client speaks Chat Completions. Astra still
      # works here for answers, but agentic runs that depend on tool calls
      # should prefer Sol, Luna, or another provider until Responses support
      # lands.
      - name: longcat
        api_key_env: LONGCAT_API_KEY
        models:
          - LongCat-2.5-Preview
          - LongCat-2.0
      - name: xai
        api_key_env: XAI_API_KEY
        models:
          - grok-4
      # Keyless frontier capability, last on purpose: hosted models win
      # when keys exist, and these catch everything otherwise. 8-16GB
      # weights — the dialog says what each needs.
      - name: embedded
        base_url: "http://127.0.0.1:11439"
        models:
          - qwen2.5-14b-instruct-q4_k_m
          - deepseek-r1-distill-qwen-14b-q4_k_m
          - mistral-nemo-instruct-2407-q4_k_m
          - falcon3-10b-instruct-q4_k_m
          - qwen2.5-coder-14b-instruct-q4_k_m
          - qwen3-8b.q4_k_m
          - starcoder2-15b-q4_k_m
          - phi-4-q4_k

# ---------------------------------------------------------------------------
# Provider behaviour
# ---------------------------------------------------------------------------
providers:
  # Total request timeout in seconds.
  timeout_seconds: 120
  # Retries for transient failures only (429, 5xx, connection loss).
  # Permanent failures such as a bad API key are never retried.
  max_retries: 2
  retry_base_delay: 1.0
  retry_max_delay: 30.0

# ---------------------------------------------------------------------------
# Router
# ---------------------------------------------------------------------------
router:
  # Tier used when classification is uncertain.
  default_tier: mid

  escalation:
    enabled: true
    # Consecutive failures before a task moves up a tier.
    max_attempts_per_tier: 2
    auto_promote_on_failure: true
    # Upper bound on promotions per task, to stop runaway escalation.
    max_escalations: 2

  # Pin every task to one model. Accepts a bare name ("gpt-4o"), a qualified
  # name ("anthropic/claude-sonnet-4-20250514"), or an OpenRouter-style id
  # ("openrouter/anthropic/claude-3-haiku"). An override that matches nothing
  # logs a warning and falls back to automatic routing.
  manual_override: null

  heuristics:
    # Keywords suggesting simple work.
    simple_keywords:
      - typo
      - spelling
      - whitespace
      - formatting
      - lint
      - rename
      - comment
      - readme
      - documentation
      - boilerplate
      - template
      - simple
      - small
      - fix

    # Keywords suggesting complex work.
    complex_keywords:
      - architecture
      - refactor
      - optimize
      - performance
      - bottleneck
      - security
      - concurrency
      - race condition
      - deadlock
      - memory leak
      - distributed
      - migration
      - redesign
      - scale
      - debug
      - investigate
      - complex

    # File patterns that raise complexity. Both glob and regex syntax work:
    # a pattern that is not valid regex is treated as a glob, so "*.rs"
    # matches src/main.rs.
    complex_file_patterns:
      - "*.rs"
      - "*.go"
      - "*.c"
      - "*.cpp"
      - "tests?/"
      - "test_"
      - "src/core/"
      - "src/engine/"
      - "migrations?/"
      - "infra/"
      - "deploy"

    # File count at which a task is treated as complex.
    min_files_for_complex: 3

# ---------------------------------------------------------------------------
# Learned classifier
# ---------------------------------------------------------------------------
# Learns tier selection from recorded outcomes. Disabled by default. The
# heuristic result always wins on disagreement, so a poorly trained model
# degrades to current behaviour rather than rerouting work.
learned_classifier:
  enabled: false
  model_file: learned_model.json
  # Outcomes required before the learned model is used at all.
  min_samples: 10
  # Weight given to the learned model versus the heuristics.
  blend: 0.5
  learning_rate: 0.5
  epochs: 50

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  enabled: true
  level: INFO
  file: gearvane.log
  log_routing_decisions: true
  log_escalations: true
  log_costs: true
  # Where the train command reads labelled outcomes from.
  feedback_file: feedback.jsonl

# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------
safety:
  # Operations that require explicit approval. See: gearvane approve
  require_approval:
    - git_push
    - git_force_push
    - deploy_production
    - deploy_staging
    - delete_branch
    - merge_pr

  # Spend ceilings in USD. These apply to hosted models, which are the
  # only runs that bill you: a tier with cost_per_token 0 is free whatever
  # it does, so a ceiling there would gate nothing.
  #
  # The TypeScript engine records usage but does not enforce these; the
  # Python reference engine checks them. `gearvane cost` reports either.
  spend_limits:
    per_session: 10.0
    per_day: 50.0
    per_task: 5.0

  # Commands permitted to run without approval.
  sandbox_allowed:
    - "git status"
    - "git log"
    - "git diff"
    - "git branch"
    - "ls"
    - "cat"
    - "head"
    - "tail"
    - "find"
    - "grep"
    - "wc"
    - "pytest"
    - "npm test"
    - "python -m pytest"

  # Commands that never run, approval or not.
  blocked_commands:
    - "rm -rf"
    - "sudo"
    - "chmod 777"
    - "dd if="
    - "mkfs"
    - ":(){"

# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
# Each model is probed against its real endpoint by `gearvane health`.
health:
  check_interval_seconds: 60
  timeout_seconds: 10
  # Above this latency a model is reported DEGRADED.
  latency_threshold_ms: 5000
  # Consecutive failures before a model is reported UNHEALTHY.
  failure_threshold: 3

# ---------------------------------------------------------------------------
# Budget alerts
# ---------------------------------------------------------------------------
# Alert thresholds as a fraction of each limit.
budget:
  per_session: 10.0
  per_day: 50.0
  per_task: 5.0
  warning_threshold: 0.7
  critical_threshold: 0.9

# ---------------------------------------------------------------------------
# Local model management
# ---------------------------------------------------------------------------
model_manager:
  ollama:
    base_url: "http://localhost:11434"
  lm_studio:
    base_url: "http://localhost:1234"
  llama_cpp:
    models_dir: "./models"

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
deployment:
  github:
    enabled: true
    require_approval_for_push: true
    require_approval_for_pr: false
    # Match your checked-out branch. See: git branch --show-current
    default_branch: master

  docker:
    enabled: true
    require_approval_for_build: false
    require_approval_for_push: true

  flyio:
    enabled: false
    require_approval_for_deploy: true

  vercel:
    enabled: false
    require_approval_for_deploy: true

  cloudflare:
    enabled: false
    require_approval_for_deploy: true
