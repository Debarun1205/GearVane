[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    build,
    dist,
    .eggs

[tool:pytest]
testpaths = tests
addopts = -q
# Deprecations become errors so a future pytest removal is caught here
# rather than by a red CI run.
filterwarnings =
    error
    default::pytest.PytestUnknownMarkWarning
    default::DeprecationWarning:waypoint.*

[coverage:run]
source = waypoint
omit =
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.: